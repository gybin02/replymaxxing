<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BossMaxxing 定制简历编辑器</title>
<link rel="stylesheet" href="resume.css">
</head>
<body>
  <div class="toolbar no-print">
    <div class="tb-left"><img src="max/max-face.svg" alt="" width="26" height="26"><div><b id="tbTitle">岗位定制简历</b><span class="muted" id="tbSub">点击任意文字即可直接修改，所有修改自动保存在本地。</span></div></div>
    <div class="tb-right">
      <button id="copyTxt" class="btn ghost">复制纯文本</button>
      <button id="dlDocx" class="btn ghost">下载 Word (.docx)</button>
      <button id="dlPdf" class="btn">导出 PDF (推荐投递)</button>
    </div>
  </div>
  <div class="wrap">
    <aside class="side no-print" id="side"></aside>
    <main><div class="warn no-print hidden" id="phWarn"></div><article class="page" id="doc"></article></main>
  </div>
  <script src="resume.js"></script>
</body>
</html>
